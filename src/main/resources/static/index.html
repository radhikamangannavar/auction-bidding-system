<!DOCTYPE html>
<html>
<head>
    <title>Auction Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">

<div class="bg-white p-8 rounded-xl shadow-lg w-96">

    <h1 class="text-2xl font-bold mb-6 text-center">Auction System</h1>

    <!-- LOGIN -->
    <h2 class="text-lg font-semibold mb-2">Login</h2>

    <input id="email" class="w-full p-2 border rounded mb-2" placeholder="Email">
    <input id="password" type="password" class="w-full p-2 border rounded mb-4" placeholder="Password">

    <button onclick="login()" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700">
        Login
    </button>

    <hr class="my-6">

    <!-- REGISTER -->
    <h2 class="text-lg font-semibold mb-2">Register</h2>

    <input id="name" class="w-full p-2 border rounded mb-2" placeholder="Name">
    <input id="regEmail" class="w-full p-2 border rounded mb-2" placeholder="Email">
    <input id="regPass" type="password" class="w-full p-2 border rounded mb-4" placeholder="Password">

    <button onclick="register()" class="w-full bg-green-600 text-white p-2 rounded hover:bg-green-700">
        Register
    </button>

</div>

<script src="script.js"></script>

</body>
</html>
