<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-6">

<h1 class="text-3xl font-bold mb-6">Live Auctions</h1>

<a href="create.html" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">
    + Create Auction
</a>

<div id="auctionGrid" class="grid grid-cols-1 md:grid-cols-3 gap-6 mt-6"></div>
<div id="bidModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center">
    <div class="bg-white p-6 rounded-lg w-96">
        <h2 class="text-xl font-bold mb-4">Bid History</h2>

        <ul id="bidList" class="space-y-2"></ul>

        <button onclick="closeModal()" class="mt-4 w-full bg-red-500 text-white p-2 rounded">
            Close
        </button>
    </div>
</div>
<script src="script.js"></script>

<script>
    window.onload = loadAuctions;
</script>

</body>
</html>
